# Чистый запуск и регистрация в один шаг: только имя.
appId: io.github.valerait.ghostlink.demo
---
- runFlow: launch.yaml
- assertVisible: "Demo mode.*"
- tapOn: "What's your name?"
- inputText: ${NAME || 'Maestro'}
# На iOS hideKeyboard ненадёжен, и нажатие на кнопку под клавиатурой попадает в подсказки.
# Там форму отправляет «✓» на клавиатуре, как и у человека.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn: "Get started"
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
# Первый запуск на холодном симуляторе CI рисует список чатов не сразу.
- extendedWaitUntil:
    visible: "My code"
    timeout: 30000
