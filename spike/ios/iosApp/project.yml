# Xcode-проект генерируется: xcodegen generate (в iosApp/). Сам .xcodeproj в git не хранится.
name: Ghostlink
options:
  bundleIdPrefix: io.github.valerait
  deploymentTarget:
    iOS: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # GitLive 2.7.0 собран против заголовков Firebase 11.x.
    from: "11.8.0"
targets:
  Ghostlink:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: GoogleService-Info.plist
        optional: true
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Ghostlink
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Камера нужна, чтобы сканировать QR-коды друзей и коды входа с других устройств.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.valerait.ghostlink
            CFBundleURLSchemes: [ghostlink]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.valerait.ghostlink
        DEVELOPMENT_TEAM: FRUVCH4G48
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin-фреймворк собирается только для arm64 (iosArm64, iosSimulatorArm64).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared, -ObjC]
