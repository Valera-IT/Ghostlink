name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Сборка, тесты, анализ
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Проверки идут на флейворе demo: ему не нужен ни Firebase, ни секреты.
      - run: ./gradlew spotlessCheck detekt assembleDemoDebug testDemoDebugUnitTest lintDemoDebug :app:koverXmlReportCi --stacktrace
      - name: Покрытие в сводку
        run: |
          echo "### Покрытие (Kover, demoDebug)" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew -q :app:koverLogCi | grep -i coverage >> "$GITHUB_STEP_SUMMARY"
      # dev собирается с настоящим конфигом ghostlink-dev, если секрет доступен (в PR из форков его нет).
      - name: Сборка dev
        env:
          GOOGLE_SERVICES_DEV: ${{ secrets.GOOGLE_SERVICES_DEV }}
        if: env.GOOGLE_SERVICES_DEV != ''
        run: |
          mkdir -p app/src/dev
          printf '%s' "$GOOGLE_SERVICES_DEV" > app/src/dev/google-services.json
          ./gradlew assembleDevDebug --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7

  firestore-rules:
    name: Тесты правил Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
      - run: npm test
