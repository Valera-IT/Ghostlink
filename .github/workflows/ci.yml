name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Сборка, тесты, анализ
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Проверки идут на флейворе demo: ему не нужен ни Firebase, ни секреты.
      - run: ./gradlew spotlessCheck detekt assembleDemoDebug testDemoDebugUnitTest jvmTest lintDemoDebug :apps:android:koverXmlReportCi --stacktrace
      - name: Покрытие в сводку
        run: |
          echo "### Покрытие (Kover, demoDebug)" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew -q :apps:android:koverLogCi | grep -i coverage >> "$GITHUB_STEP_SUMMARY"
      # dev собирается с настоящим конфигом ghostlink-dev, если секрет доступен (в PR из форков его нет).
      - name: Сборка dev
        env:
          GOOGLE_SERVICES_DEV: ${{ secrets.GOOGLE_SERVICES_DEV }}
        if: env.GOOGLE_SERVICES_DEV != ''
        run: |
          mkdir -p apps/android/src/dev
          printf '%s' "$GOOGLE_SERVICES_DEV" > apps/android/src/dev/google-services.json
          ./gradlew assembleDevDebug --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            apps/android/build/reports/
            build/reports/
          retention-days: 7

  # iOS-приложение в конфигурации Demo (без GoogleService-Info.plist): Kotlin-фреймворк, Firebase через SPM, Swift.
  # Готовый .app уходит в job maestro-ios.
  ios:
    name: Сборка iOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios/iosApp
      - run: >-
          xcodebuild -project Ghostlink.xcodeproj -scheme Ghostlink -configuration Demo
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../build/xcode CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios/iosApp
      # zip сохраняет симлинки и права внутри бандла, которые upload-artifact теряет.
      - run: ditto -c -k --keepParent Ghostlink.app "$GITHUB_WORKSPACE/ghostlink-ios-demo.zip"
        working-directory: apps/ios/build/xcode/Build/Products/Demo-iphonesimulator
      - uses: actions/upload-artifact@v4
        with:
          name: ios-demo-app
          path: ghostlink-ios-demo.zip
          retention-days: 1

  # Сквозные сценарии на demo-флейворе в эмуляторе: регистрация, чат, друг, привязка, ключ восстановления.
  maestro:
    name: Maestro-сценарии Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAESTRO_VERSION: 2.11.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew :apps:android:assembleDemoDebug --stacktrace
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Установка Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Экран как у настоящего телефона: по умолчанию эмулятор 320×640, и часть кнопок уходит за край.
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          script: |
            # Свежий эмулятор долго приходит в себя, и диалог «Pixel Launcher isn't responding»
            # закрывает приложение. Прячем системные диалоги об ошибках и даём системе успокоиться.
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            sleep 30
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb install apps/android/build/outputs/apk/demo/debug/android-demo-debug.apk
            maestro test .maestro --format junit --output build/maestro-report.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: |
            build/maestro-report.xml
            ~/.maestro/tests/
          retention-days: 7

  # Те же сценарии на iOS-симуляторе: сборка Demo из job ios, английская локаль, как у эмулятора Android.
  maestro-ios:
    name: Maestro-сценарии iOS
    needs: ios
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: ios-demo-app
      - run: ditto -x -k ghostlink-ios-demo.zip build/ios
      - name: Установка Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Симулятор
        run: |
          # Готовый iPhone самого свежего рантайма на раннере: не каждый новый тип устройства подходит к рантайму.
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key | sub(".*iOS-"; "") | split("-") | map(tonumber))
            | last | .value | map(select(.name | test("^iPhone [0-9]+"))) | first | .udid')
          xcrun simctl boot "$udid"
          xcrun simctl spawn "$udid" defaults write -g AppleLanguages -array en
          xcrun simctl spawn "$udid" defaults write -g AppleLocale en_US
          # Язык система читает при загрузке: перезагружаем симулятор с новой локалью.
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl install "$udid" build/ios/Ghostlink.app
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - run: maestro --device "$SIMULATOR_UDID" test .maestro --format junit --output build/maestro-ios-report.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-reports
          path: |
            build/maestro-ios-report.xml
            ~/.maestro/tests/
          retention-days: 7

  firestore-rules:
    name: Тесты правил Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
      - run: npm test

  worker:
    name: Тесты Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  data-emulator:
    name: Репозитории против эмулятора
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Java 21 нужна эмулятору Firestore; Gradle и Kotlin на ней тоже работают.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: npm ci
        working-directory: firebase
      # core:data на JVM (GitLive поверх firebase-java-sdk) с боевыми firestore.rules.
      - run: >-
          firebase/node_modules/.bin/firebase emulators:exec --config firebase.json --only auth,firestore --project demo-ghostlink
          "./gradlew :core:data:jvmEmulatorTest --stacktrace"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-emulator-reports
          path: core/data/build/reports/tests/
          retention-days: 7
