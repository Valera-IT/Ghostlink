name: Release Please

# Из Conventional Commits в main собирает CHANGELOG.md и держит открытым PR следующего выпуска.
# Сборки по тегу — этап 7.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
