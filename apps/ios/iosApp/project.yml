# Xcode-проект генерируется из этого файла: `xcodegen generate` в apps/ios/iosApp (см. README, раздел «iOS»).
# Ни .xcodeproj, ни Info.plist в git не хранятся: всё описано здесь.
name: Ghostlink
# Demo — отладочная сборка без Firebase для Maestro-сценариев (как флейвор demo на Android):
# свой bundle id рядом с основной сборкой, GoogleService-Info.plist в бандл не кладётся.
configs:
  Debug: debug
  Release: release
  Demo: debug
options:
  bundleIdPrefix: io.github.valerait
  deploymentTarget:
    iOS: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # GitLive 2.7.0 собран против заголовков Firebase iOS SDK 11.x: следующий мажор не берём.
    majorVersion: "11.8.0"
targets:
  Ghostlink:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: "0.6.0" # x-release-please-version
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        CADisableMinimumFrameDurationOnPhone: true
        # Перевод — в iosApp/{en,ru}.lproj/InfoPlist.strings; системные диалоги берут язык устройства.
        NSCameraUsageDescription: The camera is used to scan friends' QR codes and sign-in codes from your other devices.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.valerait.ghostlink
            CFBundleURLSchemes: [ghostlink]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCrashlytics
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../../.."
          ./gradlew :apps:ios:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # Конфиг Firebase не в git и в проект не входит: копируем, если он лежит рядом с project.yml.
      # Без него (и всегда в конфигурации Demo) приложение работает в демо-режиме, как Android без google-services.json.
      - name: Copy Firebase config
        basedOnDependencyAnalysis: false
        script: |
          config="$SRCROOT/GoogleService-Info.plist"
          target="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          if [ -f "$config" ] && [ "$CONFIGURATION" != Demo ]; then cp "$config" "$target"; else rm -f "$target"; fi
      # Символы для отчётов Crashlytics, в том числе кадров Kotlin: фреймворк статический и живёт в бинарнике приложения.
      # Только когда конфиг Firebase попал в бандл (не в Demo): без него приложение в демо-режиме и падения никуда не уходят.
      - name: Upload dSYM to Crashlytics
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          [ -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist" ] || exit 0
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.valerait.ghostlink
        DEVELOPMENT_TEAM: FRUVCH4G48
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin-фреймворк собирается только для arm64 (iosArm64, iosSimulatorArm64).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, GhostlinkKit, -ObjC]
        # dSYM и в отладочной сборке: падения dev-сборок тоже приходят в Crashlytics с символами.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        APP_DISPLAY_NAME: Ghostlink
      configs:
        Demo:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.valerait.ghostlink.demo
          APP_DISPLAY_NAME: Ghostlink Demo
          # Gradle сам не знает конфигурацию Demo: фреймворк для неё отладочный.
          KOTLIN_FRAMEWORK_BUILD_TYPE: debug
